name: Build Universal APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Universal Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating debug.keystore using keytool..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Universal Debug APK
        run: |
          if [ -f "./gradlew" ] && java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "Using gradlew wrapper..."
            ./gradlew assembleDebug --no-daemon
          else
            echo "Gradle wrapper jar not present or corrupt, falling back to installed gradle CLI..."
            gradle assembleDebug --no-daemon
          fi

      - name: Prepare Output Folder
        run: |
          mkdir -p output
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/Papirus-Icon-Pack-Universal.apk
            echo "Successfully copied universal APK to output/Papirus-Icon-Pack-Universal.apk"
          else
            echo "Searching for built APK files..."
            find app/build/outputs/apk/ -name "*.apk" -exec cp {} output/Papirus-Icon-Pack-Universal.apk \;
          fi
          ls -lh output/

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Papirus-Icon-Pack-Universal-APK
          path: output/
          if-no-files-found: error
